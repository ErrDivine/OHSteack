# Nginx配置文件 - OHSteack

# 上游服务器配置
upstream ohsteack_app {
    server 127.0.0.1:8081 fail_timeout=0;
}

# HTTP重定向到HTTPS（生产环境建议启用）
# server {
#     listen 80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# 主服务器配置
server {
    listen 81;
    # listen 443 ssl http2;  # HTTPS配置
    server_name 106.15.88.6;
    
    # SSL证书配置（生产环境）
    # ssl_certificate /path/to/ssl/cert.pem;
    # ssl_certificate_key /path/to/ssl/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    
    # 日志配置
    access_log /var/log/nginx/ohsteack_access.log;
    error_log /var/log/nginx/ohsteack_error.log;
    
    # 客户端请求限制
    client_max_body_size 50M;  # 允许上传最大50MB的文件
    client_body_buffer_size 128k;
    
    # 超时设置
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    gzip_disable "MSIE [1-6]\.";
    
    # 静态文件位置
    root /home/admin/OHSteack;
    
    # 静态文件处理
    location /static/ {
        alias /home/admin/OHSteack/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 静态文件安全头
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
    }
    
    # 上传文件处理
    location /static/uploads/ {
        alias /home/admin/OHSteack/static/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        
        # 限制访问某些文件类型
        location ~ \.(py|pyc|db|sqlite|sh)$ {
            deny all;
        }
    }
    
    # Favicon
    location /favicon.ico {
        alias /home/admin/OHSteack/static/images/favicon.ico;
        expires 1y;
        access_log off;
    }
    
    # Robots.txt
    location /robots.txt {
        alias /home/admin/OHSteack/static/robots.txt;
        expires 1d;
        access_log off;
    }
    
    # 主应用代理
    location / {
        proxy_pass http://ohsteack_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        proxy_buffering off;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 安全头
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        
        # HSTS（仅在HTTPS下启用）
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    
    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
    }
    
    # 拒绝访问Python文件
    location ~ \.py$ {
        deny all;
    }
}
