# Supervisor配置文件 - OHSteack

[program:ohsteack]
# 程序名称
process_name=%(program_name)s

# 启动命令
command=/home/admin/OHSteack/venv/bin/gunicorn -c /home/admin/OHSteack/gunicorn.conf.py run:app

# 工作目录
directory=/home/admin/OHSteack

# 运行用户
user=admin

# 环境变量
environment=PATH="/home/admin/OHSteack/venv/bin:/usr/bin:/bin",FLASK_ENV="production"

# 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

# 停止信号
stopasgroup=true
killasgroup=true
stopsignal=QUIT

# 日志配置
stdout_logfile=/var/log/supervisor/ohsteack_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stdout_capture_maxbytes=1MB

stderr_logfile=/var/log/supervisor/ohsteack_stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stderr_capture_maxbytes=1MB

# 日志级别
loglevel=info

# 进程优先级
priority=999

# 为了支持多个工作进程（可选）
# numprocs=1
# process_name=%(program_name)s_%(process_num)02d

# Celery工作进程配置（如果使用异步任务）
# [program:ohsteack_celery]
# process_name=%(program_name)s_%(process_num)02d
# command=/var/www/ohsteack/venv/bin/celery -A celery_worker.celery worker --loglevel=info
# directory=/var/www/ohsteack
# user=www-data
# numprocs=2
# stdout_logfile=/var/log/supervisor/ohsteack_celery_stdout.log
# stderr_logfile=/var/log/supervisor/ohsteack_celery_stderr.log
# autostart=true
# autorestart=true
# startsecs=10
# stopwaitsecs=600
# stopasgroup=true
# killasgroup=true

# Celery Beat调度器（如果使用定时任务）
# [program:ohsteack_celerybeat]
# process_name=%(program_name)s
# command=/var/www/ohsteack/venv/bin/celery -A celery_worker.celery beat --loglevel=info
# directory=/var/www/ohsteack
# user=www-data
# numprocs=1
# stdout_logfile=/var/log/supervisor/ohsteack_celerybeat_stdout.log
# stderr_logfile=/var/log/supervisor/ohsteack_celerybeat_stderr.log
# autostart=true
# autorestart=true
# startsecs=10
